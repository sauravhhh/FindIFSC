<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Find IFSC</title>
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #111111;
      --muted: #6b7280;
      --border: #e8e8e8;
      --border-strong: #d1d5db;
      --hover: #f5f5f5;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 48px 20px 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { width: 100%; max-width: 440px; }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -0.02em;
      text-align: center;
    }
    .sub {
      margin: 0 0 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
    }
    #ifscInput {
      width: 100%;
      padding: 14px 16px;
      font-size: 15px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 14px;
      letter-spacing: 2px;
      outline: none;
      background: var(--bg);
      color: var(--text);
      margin-bottom: 12px;
      text-transform: uppercase;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    #ifscInput:focus {
      border-color: #111111;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.06);
    }
    .buttons-row { display: flex; gap: 10px; }
    button { font-family: inherit; cursor: pointer; }
    #searchBtn {
      flex: 2;
      padding: 13px 0;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: #111111;
      border: none;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    }
    #searchBtn:hover { background: #2b2b2b; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16); }
    #searchBtn:active { transform: translateY(0); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10); }
    #clearBtn {
      flex: 1;
      padding: 13px 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    #clearBtn:hover { background: var(--hover); border-color: var(--border-strong); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.09); }
    #clearBtn:active { transform: translateY(0); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05); }
    .result-box {
      margin-top: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px 20px 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
      animation: fadeIn 0.36s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .result-header { margin-bottom: 10px; }
    .result-header code {
      font-family: inherit;
      color: var(--text);
      font-weight: 650;
      letter-spacing: 2px;
      font-size: 19px;
    }
    .bank-blue { color: var(--text); font-weight: 650; }
    .result-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
    .result-table th, .result-table td {
      font-size: 14.5px;
      padding: 10px 4px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--border);
    }
    .result-table th { color: var(--muted); font-weight: 500; width: 38%; }
    .result-table td { color: var(--text); font-weight: 550; }
    .result-table tr:last-child th, .result-table tr:last-child td { border-bottom: none; }
    #shareBtn {
      margin: 12px auto 0;
      display: block;
      width: 100%;
      padding: 13px 0;
      background: #111111;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    }
    #shareBtn:hover { background: #2b2b2b; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16); }
    #shareBtn:active { transform: translateY(0); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10); }
    #sharedMsg {
      display: block;
      color: var(--muted);
      font-size: 13.5px;
      margin: 10px auto 0;
      text-align: center;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.18s;
    }
    #sharedMsg.show { opacity: 1; }
    #error {
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      font-weight: 500;
      font-size: 14px;
      max-width: 440px;
      margin: 16px auto 0;
      padding: 12px 16px;
      text-align: center;
    }
    #error:empty { display: none; }
    footer {
      margin-top: auto;
      padding: 28px 16px;
      font-size: 12.5px;
      color: var(--muted);
      user-select: none;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Find IFSC</h1>
    <p class="sub">Look up bank branch details by IFSC code</p>
    <div class="card">
      <input type="text" id="ifscInput" maxlength="11" placeholder="Enter 11 digit IFSC" />
      <div class="buttons-row">
        <button id="clearBtn" type="button">Clear</button>
        <button id="searchBtn" type="button">Search</button>
      </div>
    </div>
    <div id="result"></div>
    <button id="shareBtn" style="display:none;">Share</button>
    <span id="sharedMsg">Shared!</span>
    <div id="error"></div>
  </div>
  <footer>Made with ❤️ by Sauravhhh</footer>
<script>
const ifscInput = document.getElementById('ifscInput');
const searchBtn = document.getElementById('searchBtn');
const clearBtn = document.getElementById('clearBtn');
const resultDiv = document.getElementById('result');
const errorDiv = document.getElementById('error');
const shareBtn = document.getElementById('shareBtn');
const sharedMsg = document.getElementById('sharedMsg');
let latestTextToShare = "";

function setPinCodeFallback(city, state) {
  // Generic fallback for major cities
  const cityPins = {
    "Guwahati": "781001", // popular pin for Guwahati center
    "Mumbai": "400001",
    "Delhi": "110001",
    "Kolkata": "700001",
    "Chennai": "600001",
    "Bangalore": "560001",
    "Hyderabad": "500001"
  };
  if (city && cityPins[city]) return cityPins[city];
  if (state === "Assam") return "781001";
  if (state === "West Bengal") return "700001";
  if (state === "Maharashtra") return "400001";
  if (state === "Delhi") return "110001";
  return "000000"; // generic placeholder (never 'N/A')
}

function formatResult(data, pinCode) {
  let micrCode = data.MICR ? data.MICR : "N/A";
  latestTextToShare =
    `IFSC Code Details\n` +
    `-----------------------------\n` +
    `Bank: ${data.BANK || ""}\n` +
    `IFSC: ${data.IFSC}\n` +
    `MICR Code: ${micrCode}\n` +
    `Branch Code: ${data.IFSC ? data.IFSC.substring(5) + " (Last Six Characters of IFSC Code)" : "N/A"}\n` +
    `Branch: ${data.BRANCH || "N/A"}\n` +
    `City: ${data.CITY || "N/A"}\n` +
    `State: ${data.STATE || "N/A"}\n` +
    `Pin Code: ${pinCode}\n` +
    `-----------------------------\n` +
    `To check IFSC details visit https://sauravhhh.github.io/FindIFSC`;

  return `
    <div class="result-box">
      <div class="result-header">
        <code>${data.IFSC}</code>
      </div>
      <table class="result-table">
        <tr>
          <th>Bank</th>
          <td><span class="bank-blue">${data.BANK || ""}</span></td>
        </tr>
        <tr>
          <th>IFSC</th>
          <td>${data.IFSC}</td>
        </tr>
        <tr>
          <th>MICR Code</th>
          <td>${micrCode}</td>
        </tr>
        <tr>
          <th>Branch Code</th>
          <td>${data.IFSC ? data.IFSC.substring(5) + " (Last Six Characters of IFSC Code)" : "N/A"}</td>
        </tr>
        <tr>
          <th>Branch</th>
          <td>${data.BRANCH || "N/A"}</td>
        </tr>
        <tr>
          <th>City</th>
          <td>${data.CITY || "N/A"}</td>
        </tr>
        <tr>
          <th>State</th>
          <td>${data.STATE || "N/A"}</td>
        </tr>
        <tr>
          <th>Pin Code</th>
          <td>${pinCode}</td>
        </tr>
      </table>
    </div>
  `;
}

function showError(msg) {
  errorDiv.textContent = msg;
  resultDiv.innerHTML = "";
  shareBtn.style.display = "none";
  sharedMsg.classList.remove("show");
}

function clearError() {
  errorDiv.textContent = "";
}

async function getPostalPinCode(query) {
  try {
    const apiURL = "https://api.postalpincode.in/postoffice/" + encodeURIComponent(query);
    const res = await fetch(apiURL);
    const json = await res.json();
    if (json && json[0] && json[0].PostOffice && json[0].PostOffice.length > 0)
      return json[0].PostOffice[0].Pincode || null;
    return null;
  } catch {
    return null;
  }
}

async function searchIFSC() {
  clearError();
  const ifsc = ifscInput.value.trim().toUpperCase();
  if (ifsc.length !== 11) {
    showError("Please enter a valid 11 digit IFSC code.");
    return;
  }
  resultDiv.innerHTML = '';
  shareBtn.style.display = "none";
  sharedMsg.classList.remove("show");

  fetch("https://ifsc.razorpay.com/" + encodeURIComponent(ifsc))
    .then(res => {
      if (!res.ok) throw new Error();
      return res.json();
    })
    .then(async data => {
      // 1. Try Razorpay's PINCODE
      let pinCode = data.PINCODE || data.POSTALCODE || "";
      // 2. Try branch name via postal API
      if (!pinCode && data.BRANCH) pinCode = await getPostalPinCode(data.BRANCH);
      // 3. Try city via postal API
      if (!pinCode && data.CITY) pinCode = await getPostalPinCode(data.CITY);
      // 4. Try address via postal API
      if (!pinCode && data.ADDRESS) pinCode = await getPostalPinCode(data.ADDRESS);
      // 5. Use fallback by city/state
      if (!pinCode && (data.CITY || data.STATE)) pinCode = setPinCodeFallback(data.CITY, data.STATE);
      resultDiv.innerHTML = formatResult(data, pinCode);
      shareBtn.style.display = "block";
    })
    .catch(() => showError("Could not find details for the entered IFSC code."));
}

searchBtn.addEventListener("click", searchIFSC);
clearBtn.addEventListener("click", () => {
  ifscInput.value = "";
  resultDiv.innerHTML = "";
  shareBtn.style.display = "none";
  sharedMsg.classList.remove("show");
  clearError();
  ifscInput.focus();
});
ifscInput.addEventListener("keyup", (e) => {
  if (e.key === "Enter") searchIFSC();
});

shareBtn.addEventListener("click", () => {
  if (navigator.share) {
    navigator.share({
      title: "IFSC Details",
      text: latestTextToShare,
    }).then(() => {
      sharedMsg.classList.add("show");
      setTimeout(()=>sharedMsg.classList.remove("show"),1200);
    });
  } else {
    navigator.clipboard.writeText(latestTextToShare).then(()=>{
      sharedMsg.textContent = "Copied! Paste anywhere to share.";
      sharedMsg.classList.add("show");
      setTimeout(()=>{sharedMsg.textContent="Shared!";sharedMsg.classList.remove("show");},1800);
    });
  }
});
</script>
</body>
</html>
