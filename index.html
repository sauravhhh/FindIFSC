<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Find IFSC</title>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Open Sans","Helvetica Neue",sans-serif; margin: 0; padding: 2rem; background: #fff; color: #222; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    h1 { margin-bottom: 1rem; font-size: 1.7rem; font-weight: 600; }
    #ifscInput { width: 100%; max-width: 400px; padding: 0.48rem 1rem; font-size: 0.92rem; border: 1px solid #bbb; border-radius: 6px; letter-spacing: 1.7px; box-sizing: border-box; outline: none; background: #fafbfc; margin-bottom: 1rem; text-transform: capitalize; }
    #ifscInput:focus { border-color: #007aff; background: #f4f8ff; }
    .buttons-row { display: flex; justify-content: space-between; max-width: 400px; width: 100%; gap: 1rem; margin-bottom: 1.1rem; }
    button { flex: 1; padding: 0.62rem 0; font-size: 1.05rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; color: white; }
    #clearBtn { background: #e0e1e6; color: #222; }
    #clearBtn:active { background: #ccc; }
    #searchBtn { background: #007aff; }
    #searchBtn:active { background: #005bbb; }
    .result-box { max-width: 400px; background: #fff; border-radius: 7px; border: 1px solid #e2e3e7; padding: 1.1rem 1rem 0.8rem 1rem; text-align: left; margin: 0 auto 1.2rem auto; font-size: 1.02em; font-family: inherit; animation: fadeIn 0.36s; }
    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
    .result-header { font-size: 1.06rem; margin-bottom: 0.41rem; font-weight: 600; color: #222; letter-spacing: 1px; }
    .result-header code { font-family: inherit; color: #007aff; background: transparent; font-weight: 600; letter-spacing: 1px; font-size: 1.05em; }
    .bank-blue { color: #007aff; font-weight: 600; }
    .result-table { width: 100%; border-collapse: collapse; margin-top: 0.3rem; }
    .result-table th, .result-table td { font-size: 1rem; padding: 0.41em 0.28em; text-align: left; vertical-align: top; border-bottom: 1px solid #f2f2f2; }
    .result-table th { color: #666; font-weight: 400; width: 38%; }
    .result-table td { color: #232323; font-weight: 500; }
    .result-table tr:last-child { border-bottom: none; }
    #shareBtn { margin: 0.8em auto 0.2em auto; display: block; max-width: 400px; width: 100%; padding: 0.7em 0; background: #007aff; color: #fff; font-size: 1.05rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; transition: background 0.2s; }
    #shareBtn:active { background: #005bbb; }
    #sharedMsg { display: block; color: #007aff; font-size: 0.98rem; margin: 0.45em auto 0; text-align: center; font-weight:500; opacity: 0; transition: opacity 0.18s; }
    #sharedMsg.show { opacity: 1; }
    #error { color: #d33; font-weight: 500; max-width: 400px; margin: 1.3rem auto 0 auto; padding: 0; text-align: center; }
    footer { margin-top: auto; padding: 1rem; font-size: 0.93rem; color: #666; user-select: none; text-align: center; width: 100%; }
  </style>
</head>
<body>
  <h1>Find IFSC</h1>
  <input type="text" id="ifscInput" maxlength="11" placeholder="Enter 11 digit IFSC" />
  <div class="buttons-row">
    <button id="clearBtn" type="button">Clear</button>
    <button id="searchBtn" type="button">Search</button>
  </div>
  <div id="result"></div>
  <button id="shareBtn" style="display:none;">Share</button>
  <span id="sharedMsg">Shared!</span>
  <div id="error"></div>
  <footer>Made with ❤️ by Sauravhhh</footer>
<script>
const ifscInput = document.getElementById('ifscInput');
const searchBtn = document.getElementById('searchBtn');
const clearBtn = document.getElementById('clearBtn');
const resultDiv = document.getElementById('result');
const errorDiv = document.getElementById('error');
const shareBtn = document.getElementById('shareBtn');
const sharedMsg = document.getElementById('sharedMsg');
let latestTextToShare = "";

function setPinCodeFallback(city, state) {
  // Generic fallback for major cities
  const cityPins = {
    "Guwahati": "781001", // popular pin for Guwahati center
    "Mumbai": "400001",
    "Delhi": "110001",
    "Kolkata": "700001",
    "Chennai": "600001",
    "Bangalore": "560001",
    "Hyderabad": "500001"
  };
  if (city && cityPins[city]) return cityPins[city];
  if (state === "Assam") return "781001";
  if (state === "West Bengal") return "700001";
  if (state === "Maharashtra") return "400001";
  if (state === "Delhi") return "110001";
  return "000000"; // generic placeholder (never 'N/A')
}

function formatResult(data, pinCode) {
  let micrCode = data.MICR ? data.MICR : "N/A";
  latestTextToShare =
    `IFSC Code Details\n` +
    `-----------------------------\n` +
    `Bank: ${data.BANK || ""}\n` +
    `IFSC: ${data.IFSC}\n` +
    `MICR Code: ${micrCode}\n` +
    `Branch Code: ${data.IFSC ? data.IFSC.substring(5) + " (Last Six Characters of IFSC Code)" : "N/A"}\n` +
    `Branch: ${data.BRANCH || "N/A"}\n` +
    `City: ${data.CITY || "N/A"}\n` +
    `State: ${data.STATE || "N/A"}\n` +
    `Pin Code: ${pinCode}\n` +
    `-----------------------------\n` +
    `To check IFSC details visit https://sauravhhh.github.io/FindIFSC`;

  return `
    <div class="result-box">
      <div class="result-header">
        <code>${data.IFSC}</code>
      </div>
      <table class="result-table">
        <tr>
          <th>Bank:</th>
          <td><span class="bank-blue">${data.BANK || ""}</span></td>
        </tr>
        <tr>
          <th>IFSC:</th>
          <td>${data.IFSC}</td>
        </tr>
        <tr>
          <th>MICR Code:</th>
          <td>${micrCode}</td>
        </tr>
        <tr>
          <th>Branch Code:</th>
          <td>${data.IFSC ? data.IFSC.substring(5) + " (Last Six Characters of IFSC Code)" : "N/A"}</td>
        </tr>
        <tr>
          <th>Branch:</th>
          <td>${data.BRANCH || "N/A"}</td>
        </tr>
        <tr>
          <th>City:</th>
          <td>${data.CITY || "N/A"}</td>
        </tr>
        <tr>
          <th>State:</th>
          <td>${data.STATE || "N/A"}</td>
        </tr>
        <tr>
          <th>Pin Code:</th>
          <td>${pinCode}</td>
        </tr>
      </table>
    </div>
  `;
}

function showError(msg) {
  errorDiv.textContent = msg;
  resultDiv.innerHTML = "";
  shareBtn.style.display = "none";
  sharedMsg.classList.remove("show");
}

function clearError() {
  errorDiv.textContent = "";
}

async function getPostalPinCode(query) {
  try {
    const apiURL = "https://api.postalpincode.in/postoffice/" + encodeURIComponent(query);
    const res = await fetch(apiURL);
    const json = await res.json();
    if (json && json[0] && json[0].PostOffice && json[0].PostOffice.length > 0)
      return json[0].PostOffice[0].Pincode || null;
    return null;
  } catch {
    return null;
  }
}

async function searchIFSC() {
  clearError();
  const ifsc = ifscInput.value.trim().toUpperCase();
  if (ifsc.length !== 11) {
    showError("Please enter a valid 11 digit IFSC code.");
    return;
  }
  resultDiv.innerHTML = '';
  shareBtn.style.display = "none";
  sharedMsg.classList.remove("show");

  fetch("https://ifsc.razorpay.com/" + encodeURIComponent(ifsc))
    .then(res => {
      if (!res.ok) throw new Error();
      return res.json();
    })
    .then(async data => {
      // 1. Try Razorpay's PINCODE
      let pinCode = data.PINCODE || data.POSTALCODE || "";
      // 2. Try branch name via postal API
      if (!pinCode && data.BRANCH) pinCode = await getPostalPinCode(data.BRANCH);
      // 3. Try city via postal API
      if (!pinCode && data.CITY) pinCode = await getPostalPinCode(data.CITY);
      // 4. Try address via postal API
      if (!pinCode && data.ADDRESS) pinCode = await getPostalPinCode(data.ADDRESS);
      // 5. Use fallback by city/state
      if (!pinCode && (data.CITY || data.STATE)) pinCode = setPinCodeFallback(data.CITY, data.STATE);
      resultDiv.innerHTML = formatResult(data, pinCode);
      shareBtn.style.display = "block";
    })
    .catch(() => showError("Could not find details for the entered IFSC code."));
}

searchBtn.addEventListener("click", searchIFSC);
clearBtn.addEventListener("click", () => {
  ifscInput.value = "";
  resultDiv.innerHTML = "";
  shareBtn.style.display = "none";
  sharedMsg.classList.remove("show");
  clearError();
  ifscInput.focus();
});
ifscInput.addEventListener("keyup", (e) => {
  if (e.key === "Enter") searchIFSC();
});

shareBtn.addEventListener("click", () => {
  if (navigator.share) {
    navigator.share({
      title: "IFSC Details",
      text: latestTextToShare,
    }).then(() => {
      sharedMsg.classList.add("show");
      setTimeout(()=>sharedMsg.classList.remove("show"),1200);
    });
  } else {
    navigator.clipboard.writeText(latestTextToShare).then(()=>{
      sharedMsg.textContent = "Copied! Paste anywhere to share.";
      sharedMsg.classList.add("show");
      setTimeout(()=>{sharedMsg.textContent="Shared!";sharedMsg.classList.remove("show");},1800);
    });
  }
});
</script>
</body>
  </html>
