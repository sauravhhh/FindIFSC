<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Find IFSC</title>
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #111111;
      --muted: #6b7280;
      --border: #e8e8e8;
      --border-strong: #d1d5db;
      --hover: #f5f5f5;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 48px 20px 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -0.02em;
      text-align: center;
    }
    .sub {
      margin: 0 0 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
    }
    .form {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 6px 2px;
    }
    select {
      width: 100%;
      padding: 13px 14px;
      font-size: 14.5px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--bg);
      margin-bottom: 14px;
      outline: none;
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .form select:last-child { margin-bottom: 0; }
    select:focus {
      border-color: #111111;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.06);
    }
    select:disabled { opacity: 0.45; }
    #loading {
      display: none;
      color: var(--muted);
      font-size: 13.5px;
      margin: 14px 0 4px;
      text-align: center;
      font-weight: 500;
    }
    #loading.show { display: block; }
    .result-box {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px 20px 12px;
      margin: 16px auto 0;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
      animation: fadeIn 0.36s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .result-header { margin-bottom: 10px; }
    .result-header code {
      font-family: inherit;
      color: var(--text);
      font-weight: 650;
      letter-spacing: 2px;
      font-size: 19px;
    }
    .bank-blue { color: var(--text); font-weight: 650; }
    .result-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
    .result-table th, .result-table td {
      font-size: 14.5px;
      padding: 10px 4px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--border);
    }
    .result-table th { color: var(--muted); font-weight: 500; width: 38%; }
    .result-table td { color: var(--text); font-weight: 550; }
    .result-table tr:last-child th, .result-table tr:last-child td { border-bottom: none; }
    .share-btn {
      font-family: inherit;
      margin: 12px auto 0;
      display: block;
      width: 100%;
      max-width: 400px;
      padding: 13px 0;
      background: #111111;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    }
    .share-btn:hover { background: #2b2b2b; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16); }
    .share-btn:active { transform: translateY(0); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10); }
    .shared-msg {
      display: block;
      color: var(--muted);
      font-size: 13.5px;
      margin: 10px auto 0;
      text-align: center;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.18s;
    }
    .shared-msg.show { opacity: 1; }
    .error-msg {
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      font-weight: 500;
      font-size: 14px;
      width: 100%;
      max-width: 400px;
      margin: 16px auto 0;
      padding: 12px 16px;
      text-align: center;
    }
    .error-msg:empty { display: none; }
    footer {
      margin-top: auto;
      padding: 28px 16px;
      font-size: 12.5px;
      color: var(--muted);
      user-select: none;
      text-align: center;
      width: 100%;
    }
  
    .tabs {
      display: flex;
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .tab {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      color: var(--muted);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }
    .tab.active {
      background: #111111;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }
    #ifscInput {
      width: 100%;
      padding: 13px 14px;
      font-size: 15px;
      font-family: inherit;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    #ifscInput:focus {
      border-color: #111111;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.06);
    }
    .ifsc-buttons { display: flex; gap: 10px; }
    #ifscSearchBtn {
      flex: 2;
      padding: 13px 0;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      color: #ffffff;
      background: #111111;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    }
    #ifscSearchBtn:hover { background: #2b2b2b; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16); }
    #ifscSearchBtn:active { transform: translateY(0); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10); }
    #ifscClearBtn {
      flex: 1;
      padding: 13px 0;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    #ifscClearBtn:hover { background: var(--hover); border-color: var(--border-strong); transform: translateY(-1px); }
    #ifscClearBtn:active { transform: translateY(0); }
</style>
</head>
<body>
  <h1>Find IFSC</h1>
  <p class="sub">Find any branch IFSC code, either way</p>
  <div class="tabs">
    <button class="tab active" data-mode="bank" onclick="switchTab('bank')">By Bank</button>
    <button class="tab" data-mode="ifsc" onclick="switchTab('ifsc')">By IFSC</button>
  </div>
  <div id="panel-bank">
  <div class="form">
    <label for="bankSelect">Bank</label>
    <select id="bankSelect"><option value="">Loading banks…</option></select>
    <label for="stateSelect">State</label>
    <select id="stateSelect" disabled><option value="">Select State</option></select>
    <label for="districtSelect">District</label>
    <select id="districtSelect" disabled><option value="">Select District</option></select>
    <label for="centerSelect">Center</label>
    <select id="centerSelect" disabled><option value="">Select Center</option></select>
    <label for="branchSelect">Branch</label>
    <select id="branchSelect" disabled><option value="">Select Branch</option></select>
  </div>
  <div id="loading">Loading branches…</div>
  <div id="result"></div>
  <button id="shareBtn" class="share-btn" style="display:none;">Share</button>
  <span id="sharedMsg" class="shared-msg">Shared!</span>
  <div id="error" class="error-msg"></div>
  </div>
  <div id="panel-ifsc" style="display:none;">
  <div class="form">
    <label for="ifscInput">IFSC Code</label>
    <input type="text" id="ifscInput" maxlength="11" placeholder="e.g. HDFC0001234" />
    <div class="ifsc-buttons">
      <button id="ifscClearBtn" type="button">Clear</button>
      <button id="ifscSearchBtn" type="button">Search</button>
    </div>
  </div>
  <div id="ifscResult"></div>
  <button id="ifscShareBtn" class="share-btn" style="display:none;">Share</button>
  <span id="ifscSharedMsg" class="shared-msg">Shared!</span>
  <div id="ifscError" class="error-msg"></div>
  </div>
  <footer>Made with ❤️ by Sauravhhh</footer>
<script>
const API = "https://bank-apis.justinclicks.com";
const bankSelect = document.getElementById('bankSelect');
const stateSelect = document.getElementById('stateSelect');
const districtSelect = document.getElementById('districtSelect');
const centerSelect = document.getElementById('centerSelect');
const branchSelect = document.getElementById('branchSelect');
const resultDiv = document.getElementById('result');
const errorDiv = document.getElementById('error');
const shareBtn = document.getElementById('shareBtn');
const sharedMsg = document.getElementById('sharedMsg');
const loadingDiv = document.getElementById('loading');
let latestTextToShare = "";
let branchData = []; // filtered branch objects for current center+bank

async function jget(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

function fillSelect(sel, items, placeholder) {
  sel.innerHTML = "";
  const ph = document.createElement('option');
  ph.value = "";
  ph.textContent = placeholder;
  sel.appendChild(ph);
  items.forEach(it => {
    const o = document.createElement('option');
    o.value = it.value;
    o.textContent = it.label;
    sel.appendChild(o);
  });
  sel.disabled = false;
}

function resetDownstream(from) {
  const chain = [stateSelect, districtSelect, centerSelect, branchSelect];
  const idx = chain.indexOf(from);
  const labels = ["Select State", "Select District", "Select Center", "Select Branch"];
  for (let i = idx; i < chain.length; i++) {
    fillSelect(chain[i], [], labels[i]);
    chain[i].disabled = true;
  }
  resultDiv.innerHTML = "";
  shareBtn.style.display = "none";
  sharedMsg.classList.remove("show");
  errorDiv.textContent = "";
}

function showError(msg) {
  errorDiv.textContent = msg;
  resultDiv.innerHTML = "";
  shareBtn.style.display = "none";
  sharedMsg.classList.remove("show");
}

function setPinCodeFallback(city, state) {
  const cityPins = {
    "Guwahati": "781001",
    "Mumbai": "400001",
    "Delhi": "110001",
    "Kolkata": "700001",
    "Chennai": "600001",
    "Bangalore": "560001",
    "Hyderabad": "500001"
  };
  if (city && cityPins[city]) return cityPins[city];
  if (state === "Assam") return "781001";
  if (state === "West Bengal") return "700001";
  if (state === "Maharashtra") return "400001";
  if (state === "Delhi") return "110001";
  return "000000";
}

async function getPostalPinCode(query) {
  try {
    const apiURL = "https://api.postalpincode.in/postoffice/" + encodeURIComponent(query);
    const res = await fetch(apiURL);
    const json = await res.json();
    if (json && json[0] && json[0].PostOffice && json[0].PostOffice.length > 0)
      return json[0].PostOffice[0].Pincode || null;
    return null;
  } catch {
    return null;
  }
}

async function formatResult(data) {
  let pinCode = "";
  if (data.BRANCH) pinCode = await getPostalPinCode(data.BRANCH);
  if (!pinCode && data.CITY) pinCode = await getPostalPinCode(data.CITY);
  if (!pinCode && data.ADDRESS) pinCode = await getPostalPinCode(data.ADDRESS);
  if (!pinCode && (data.CITY || data.STATE)) pinCode = setPinCodeFallback(data.CITY, data.STATE);

  let micrCode = data.MICR ? data.MICR : "N/A";
  latestTextToShare =
    `IFSC Code Details\n` +
    `-----------------------------\n` +
    `Bank: ${data.BANK || ""}\n` +
    `IFSC: ${data.IFSC}\n` +
    `MICR Code: ${micrCode}\n` +
    `Branch: ${data.BRANCH || "N/A"}\n` +
    `Address: ${data.ADDRESS || "N/A"}\n` +
    `City: ${data.CITY || "N/A"}\n` +
    `District: ${data.DISTRICT || "N/A"}\n` +
    `State: ${data.STATE || "N/A"}\n` +
    `Pin Code: ${pinCode}\n` +
    `-----------------------------\n` +
    `To check IFSC details visit https://sauravhhh.github.io/FindIFSC`;

  return `
    <div class="result-box">
      <div class="result-header">
        <code>${data.IFSC}</code>
      </div>
      <table class="result-table">
        <tr><th>Bank:</th><td><span class="bank-blue">${data.BANK || ""}</span></td></tr>
        <tr><th>IFSC:</th><td>${data.IFSC}</td></tr>
        <tr><th>MICR Code:</th><td>${micrCode}</td></tr>
        <tr><th>Branch:</th><td>${data.BRANCH || "N/A"}</td></tr>
        <tr><th>Address:</th><td>${data.ADDRESS || "N/A"}</td></tr>
        <tr><th>City:</th><td>${data.CITY || "N/A"}</td></tr>
        <tr><th>District:</th><td>${data.DISTRICT || "N/A"}</td></tr>
        <tr><th>State:</th><td>${data.STATE || "N/A"}</td></tr>
        <tr><th>Pin Code:</th><td>${pinCode}</td></tr>
      </table>
    </div>
  `;
}

bankSelect.addEventListener('change', () => {
  resetDownstream(stateSelect);
  if (!bankSelect.value) return;
  stateSelect.disabled = false;
});

stateSelect.addEventListener('change', async () => {
  resetDownstream(districtSelect);
  const state = stateSelect.value;
  if (!state) return;
  try {
    const districts = await jget(API + "/API/V1/STATE/" + encodeURIComponent(state) + "/");
    fillSelect(districtSelect, districts.map(d => ({ value: d, label: d })), "Select District");
  } catch {
    showError("Could not load districts. Please try again.");
  }
});

districtSelect.addEventListener('change', async () => {
  resetDownstream(centerSelect);
  const state = stateSelect.value;
  const district = districtSelect.value;
  if (!district) return;
  try {
    const centers = await jget(API + "/API/V1/STATE/" + encodeURIComponent(state) + "/" + encodeURIComponent(district) + "/");
    fillSelect(centerSelect, centers.map(c => ({ value: c, label: c })), "Select Center");
  } catch {
    showError("Could not load centers. Please try again.");
  }
});

centerSelect.addEventListener('change', async () => {
  resetDownstream(branchSelect);
  const state = stateSelect.value;
  const district = districtSelect.value;
  const center = centerSelect.value;
  const bankCode = bankSelect.value;
  if (!center) return;
  const bankName = bankSelect.options[bankSelect.selectedIndex].text;
  loadingDiv.textContent = "Loading " + bankName + " branches in " + center + "…";
  loadingDiv.classList.add("show");
  try {
    const base = API + "/API/V1/STATE/" + encodeURIComponent(state) + "/" + encodeURIComponent(district) + "/" + encodeURIComponent(center) + "/" + encodeURIComponent(center) + "/";
    const files = await jget(base);
    const results = await Promise.allSettled(
      files.map(f => jget(base + encodeURIComponent(f)).catch(() => null))
    );
    branchData = results
      .map(r => (r.status === "fulfilled" ? r.value : null))
      .filter(d => d && d.BANKCODE === bankCode && d.IFSC);
    branchData.sort((a, b) => (a.BRANCH || "").localeCompare(b.BRANCH || ""));
    loadingDiv.classList.remove("show");
    if (!branchData.length) {
      showError("No " + bankName + " branches found in " + center + ".");
      return;
    }
    fillSelect(branchSelect, branchData.map((d, i) => ({ value: String(i), label: d.BRANCH })), "Select Branch (" + branchData.length + ")");
  } catch {
    loadingDiv.classList.remove("show");
    showError("Could not load branches. Please try again.");
  }
});

branchSelect.addEventListener('change', async () => {
  errorDiv.textContent = "";
  resultDiv.innerHTML = "";
  shareBtn.style.display = "none";
  sharedMsg.classList.remove("show");
  if (branchSelect.value === "") return;
  const data = branchData[parseInt(branchSelect.value, 10)];
  if (!data) return;
  resultDiv.innerHTML = await formatResult(data);
  shareBtn.style.display = "block";
});

shareBtn.addEventListener("click", () => {
  if (navigator.share) {
    navigator.share({
      title: "IFSC Details",
      text: latestTextToShare,
    }).then(() => {
      sharedMsg.classList.add("show");
      setTimeout(()=>sharedMsg.classList.remove("show"),1200);
    });
  } else {
    navigator.clipboard.writeText(latestTextToShare).then(()=>{
      sharedMsg.textContent = "Copied! Paste anywhere to share.";
      sharedMsg.classList.add("show");
      setTimeout(()=>{sharedMsg.textContent="Shared!";sharedMsg.classList.remove("show");},1800);
    });
  }
});

// Init: load banks + states
(async function init() {
  try {
    const [bankNames, states] = await Promise.all([
      jget("https://cdn.jsdelivr.net/npm/ifsc@2.0.50/src/banknames.json"),
      jget(API + "/API/V1/STATE/")
    ]);
    const banks = Object.entries(bankNames)
      .map(([code, name]) => ({ value: code, label: name }))
      .sort((a, b) => a.label.localeCompare(b.label));
    fillSelect(bankSelect, banks, "Select Bank");
    fillSelect(stateSelect, states.map(s => ({ value: s, label: s })), "Select State");
    stateSelect.disabled = true; // enabled once a bank is chosen
  } catch {
    bankSelect.innerHTML = '<option value="">Failed to load. Reload page.</option>';
    showError("Could not load data. Check your connection and reload.");
  }
})();

// ---------- By IFSC mode ----------
const ifscInput = document.getElementById('ifscInput');
const ifscSearchBtn = document.getElementById('ifscSearchBtn');
const ifscClearBtn = document.getElementById('ifscClearBtn');
const ifscResultDiv = document.getElementById('ifscResult');
const ifscErrorDiv = document.getElementById('ifscError');
const ifscShareBtn = document.getElementById('ifscShareBtn');
const ifscSharedMsg = document.getElementById('ifscSharedMsg');
let ifscTextToShare = "";

function switchTab(mode) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  document.getElementById('panel-bank').style.display = mode === 'bank' ? '' : 'none';
  document.getElementById('panel-ifsc').style.display = mode === 'ifsc' ? '' : 'none';
}

function ifscShowError(msg) {
  ifscErrorDiv.textContent = msg;
  ifscResultDiv.innerHTML = "";
  ifscShareBtn.style.display = "none";
  ifscSharedMsg.classList.remove("show");
}

async function formatIfscResult(data) {
  let pinCode = data.PINCODE || data.POSTALCODE || "";
  if (!pinCode && data.BRANCH) pinCode = await getPostalPinCode(data.BRANCH);
  if (!pinCode && data.CITY) pinCode = await getPostalPinCode(data.CITY);
  if (!pinCode && data.ADDRESS) pinCode = await getPostalPinCode(data.ADDRESS);
  if (!pinCode && (data.CITY || data.STATE)) pinCode = setPinCodeFallback(data.CITY, data.STATE);

  let micrCode = data.MICR ? data.MICR : "N/A";
  ifscTextToShare =
    `IFSC Code Details\n` +
    `-----------------------------\n` +
    `Bank: ${data.BANK || ""}\n` +
    `IFSC: ${data.IFSC}\n` +
    `MICR Code: ${micrCode}\n` +
    `Branch Code: ${data.IFSC ? data.IFSC.substring(5) + " (Last Six Characters of IFSC Code)" : "N/A"}\n` +
    `Branch: ${data.BRANCH || "N/A"}\n` +
    `City: ${data.CITY || "N/A"}\n` +
    `State: ${data.STATE || "N/A"}\n` +
    `Pin Code: ${pinCode}\n` +
    `-----------------------------\n` +
    `To check IFSC details visit https://sauravhhh.github.io/FindIFSC`;

  return `
    <div class="result-box">
      <div class="result-header">
        <code>${data.IFSC}</code>
      </div>
      <table class="result-table">
        <tr><th>Bank:</th><td><span class="bank-blue">${data.BANK || ""}</span></td></tr>
        <tr><th>IFSC:</th><td>${data.IFSC}</td></tr>
        <tr><th>MICR Code:</th><td>${micrCode}</td></tr>
        <tr><th>Branch Code:</th><td>${data.IFSC ? data.IFSC.substring(5) + " (Last Six Characters of IFSC Code)" : "N/A"}</td></tr>
        <tr><th>Branch:</th><td>${data.BRANCH || "N/A"}</td></tr>
        <tr><th>City:</th><td>${data.CITY || "N/A"}</td></tr>
        <tr><th>State:</th><td>${data.STATE || "N/A"}</td></tr>
        <tr><th>Pin Code:</th><td>${pinCode}</td></tr>
      </table>
    </div>
  `;
}

async function searchIfsc() {
  ifscErrorDiv.textContent = "";
  const ifsc = ifscInput.value.trim().toUpperCase();
  if (ifsc.length !== 11) {
    ifscShowError("Please enter a valid 11 digit IFSC code.");
    return;
  }
  ifscResultDiv.innerHTML = '';
  ifscShareBtn.style.display = "none";
  ifscSharedMsg.classList.remove("show");
  try {
    const res = await fetch("https://ifsc.razorpay.com/" + encodeURIComponent(ifsc));
    if (!res.ok) throw new Error();
    const data = await res.json();
    ifscResultDiv.innerHTML = await formatIfscResult(data);
    ifscShareBtn.style.display = "block";
  } catch {
    ifscShowError("Could not find details for the entered IFSC code.");
  }
}

ifscSearchBtn.addEventListener("click", searchIfsc);
ifscClearBtn.addEventListener("click", () => {
  ifscInput.value = "";
  ifscResultDiv.innerHTML = "";
  ifscShareBtn.style.display = "none";
  ifscSharedMsg.classList.remove("show");
  ifscErrorDiv.textContent = "";
  ifscInput.focus();
});
ifscInput.addEventListener("keyup", (e) => {
  if (e.key === "Enter") searchIfsc();
});

ifscShareBtn.addEventListener("click", () => {
  if (navigator.share) {
    navigator.share({
      title: "IFSC Details",
      text: ifscTextToShare,
    }).then(() => {
      ifscSharedMsg.classList.add("show");
      setTimeout(()=>ifscSharedMsg.classList.remove("show"),1200);
    });
  } else {
    navigator.clipboard.writeText(ifscTextToShare).then(()=>{
      ifscSharedMsg.textContent = "Copied! Paste anywhere to share.";
      ifscSharedMsg.classList.add("show");
      setTimeout(()=>{ifscSharedMsg.textContent="Shared!";ifscSharedMsg.classList.remove("show");},1800);
    });
  }
});

</script>
</body>
</html>
